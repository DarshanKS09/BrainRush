# Fly.io: single persistent machine running bot polling + API.
# Deploy: fly launch (no need to re-run) -> fly secrets set ... -> fly deploy
app = "brainrush"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "8000"

# Single machine = single Telegram poller. Never scale above 1 while using
# long polling, or users will get double answers.
[[vm]]
  size = "shared-cpu-1x"
